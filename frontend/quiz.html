<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz – EduBridge</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header>
  <div class="logo">🎓 EduBridge</div>
  <nav>
    <a href="index.html">🏠 Home</a>
    <a href="videos.html">📺 Videos</a>
    <a href="quiz.html" class="active">📝 Quiz</a>
    <a href="gk.html">🧠 GK</a>
    <a href="practice.html">📄 Practice</a>
  </nav>
</header>

<!-- ===== MAIN ===== -->
<div class="main">
  <h1>📝 Smart Quiz!</h1>
  <p>Test your knowledge and see how much you've learned. 🌟</p>

  <!-- Step 1: Select Topic -->
  <div id="quiz-setup">
    <h2 style="margin-top:24px;">Select Subject & Class</h2>
    
    <div style="margin:20px 0;">
      <button class="filter-btn active" id="btn-maths" onclick="setSubject('maths')">📐 Maths</button>
      <button class="filter-btn" id="btn-english" onclick="setSubject('english')">📖 English</button>
    </div>

    <div>
      <select id="class-select" style="padding:10px; font-size:16px; border-radius:10px; border:2px solid var(--blue); font-family:var(--font-main);">
        <option value="Class 1">Class 1</option>
        <option value="Class 2">Class 2</option>
        <option value="Class 3">Class 3</option>
        <option value="Class 4">Class 4</option>
        <option value="Class 5">Class 5</option>
      </select>
    </div>
    
    <br>
    <button class="btn-primary" onclick="startQuiz()">Play Quiz 🚀</button>
  </div>

  <!-- Step 2: Quiz Area (hidden initially) -->
  <div id="quiz-area" style="display:none;">
    <div id="progress">Question <span id="q-num">1</span> / <span id="q-total">10</span></div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar" style="width: 0%;"></div>
    </div>
    
    <div id="question-text">Loading question...</div>
    <div id="options"></div>
    <div id="feedback"></div>
  </div>

  <!-- Step 3: Result Area (hidden initially) -->
  <div id="result-area" style="display:none;">
    <h2>Quiz Complete! 🎉</h2>
    <div class="score-label">Your Score:</div>
    <div class="score-big" id="final-score">0</div>
    <p id="score-message" style="font-size:20px; font-weight:800; margin:16px 0; color:var(--blue);"></p>
    <button class="btn-primary" onclick="location.reload()">Play Again 🔄</button>
  </div>

</div>

<script src="js/quiz.js"></script>
</body>
</html>
