<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice – EduBridge</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header>
    <div class="logo">🎓 EduBridge</div>
    <nav>
      <a href="index.html">🏠 Home</a>
      <a href="videos.html">📺 Videos</a>
      <a href="quiz.html">📝 Quiz</a>
      <a href="gk.html">🧠 GK</a>
      <a href="practice.html" class="active">📄 Practice</a>
    </nav>
  </header>

  <!-- ===== MAIN ===== -->
  <div class="main">
    <h1>📄 Practice Worksheets</h1>
    <p>Download and print worksheets to practice offline!</p>

    <!-- Filters -->
    <div style="margin-top:20px;">
      <strong>Filter by Subject:</strong><br>
      <button class="filter-btn active" onclick="filterPDF('all', this)">All</button>
      <button class="filter-btn" onclick="filterPDF('maths', this)">📐 Maths</button>
      <button class="filter-btn" onclick="filterPDF('english', this)">📖 English</button>
    </div>

    <div class="pdf-grid" id="pdf-grid">
      <!-- PDFs generated by JS -->
    </div>
  </div>

  <script>
    // Practice PDFs Data
    const pdfs = [
      { subject: 'maths', title: 'Class 1: Numbers & Counting', class: 'Class 1', dummyURL: '#' },
      { subject: 'maths', title: 'Class 1: Simple Addition', class: 'Class 1', dummyURL: '#' },
      { subject: 'english', title: 'Class 1: Alphabet Tracing', class: 'Class 1', dummyURL: '#' },

      { subject: 'maths', title: 'Class 2: 2-Digit Addition', class: 'Class 2', dummyURL: '#' },
      { subject: 'english', title: 'Class 2: Nouns & Verbs', class: 'Class 2', dummyURL: '#' },

      { subject: 'maths', title: 'Class 3: Multiplication Tables', class: 'Class 3', dummyURL: '#' },
      { subject: 'english', title: 'Class 3: Reading Comprehension', class: 'Class 3', dummyURL: '#' },

      { subject: 'maths', title: 'Class 4: Fractions Basics', class: 'Class 4', dummyURL: '#' },
      { subject: 'english', title: 'Class 4: Adjectives & Adverbs', class: 'Class 4', dummyURL: '#' },

      { subject: 'maths', title: 'Class 5: Word Problems', class: 'Class 5', dummyURL: '#' },
      { subject: 'english', title: 'Class 5: Sentences & Grammar', class: 'Class 5', dummyURL: '#' }
    ];

    function renderPDFs(filter) {
      const container = document.getElementById('pdf-grid');
      container.innerHTML = ""; // Clear existing

      const filtered = filter === 'all' ? pdfs : pdfs.filter(p => p.subject === filter);

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "pdf-card";

        const icon = item.subject === 'maths' ? '📐' : '📖';

        card.innerHTML = `
      <div class="pdf-icon">${icon}</div>
      <h3>${item.title}</h3>
      <p>${item.class} • ${item.subject.toUpperCase()}</p>
      <button class="btn-preview" onclick="alert('Previewing PDF offline placeholder.')">👁️ View</button>
      <button class="btn-download" onclick="alert('Downloading dummy PDF file.')">💻 Download</button>
    `;

        container.appendChild(card);
      });
    }

    function filterPDF(subject, btnElement) {
      // Setup active class
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      // render
      renderPDFs(subject);
    }

    // Initial render
    renderPDFs('all');
  </script>

</body>

</html>
