<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduBridge Videos</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
  <h2>📺 Classroom Learning</h2>
</header>

<div class="container">

  <!-- SUBJECT SELECT -->
  <h3>Select Subject</h3>
  <button onclick="loadSubject('math')">Maths</button>
  <button onclick="loadSubject('english')">English</button>

  <!-- STANDARD / TOPIC -->
  <div id="topics"></div>

  <!-- VIDEO PLAYER -->
  <div id="player"></div>

  <!-- SUMMARY -->
  <div id="summaryBox">
    <h3>📘 Easy Summary</h3>
    <p id="summaryText">Select a video to see summary</p>
  </div>

</div>

<script src="js/videos.js"></script>
</body>
</html>
